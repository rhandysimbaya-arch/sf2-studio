plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sf2studio'
    compileSdk 34

    defaultConfig {
        applicationId "com.sf2studio.sf2editor"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
